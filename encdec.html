<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CRYPTICX Ultra Hardened (Dark)</title>

<!-- Libraries -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@10"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

:root{
  --accent:#00ffcc;
  --bg:#000000;
  --panel:#111111;
  --panel-light:#1a1a1a;
  --text:#ffffff;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:18px}
.card{width:100%;max-width:950px;background:var(--panel);border-radius:12px;padding:20px;border:2px solid rgba(0,255,204,0.2);box-shadow:0 14px 40px rgba(0,0,0,0.7);display:none}
h1{color:var(--accent);font-size:22px;margin-bottom:12px;text-align:center}
.grid{display:grid;grid-template-columns:1fr 380px;gap:14px}
textarea,input,select{width:100%;padding:10px;border-radius:8px;border:2px solid var(--accent);background:var(--panel-light);color:var(--accent);outline:none;font-size:14px}
textarea{min-height:130px;resize:vertical}
.btn{display:inline-block;padding:10px;border-radius:8px;border:none;background:linear-gradient(45deg,var(--accent),#009999);color:#111;font-weight:700;cursor:pointer;margin-top:6px;transition:0.2s}
.btn:hover{transform:scale(1.05)}
.small{padding:8px;font-size:13px}
.col{display:flex;flex-direction:column;gap:8px}
.name-tag{font-weight:700;color:var(--accent);text-shadow:0 0 6px rgba(0,255,204,0.3);text-align:center;padding:8px;border-radius:6px;background:rgba(0,255,204,0.05)}
pre{background:var(--panel-light);padding:12px;border-radius:8px;overflow:auto;color:#fff;white-space:pre-wrap;word-break:break-word}
.row{display:flex;gap:8px}
.side-section{background:rgba(0,0,0,0.2);padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,0.1)}
.link-list{display:flex;flex-direction:row;gap:10px;margin-top:8px}
.muted{color:#bfc7c9;font-size:13px;margin-top:6px}
@media (max-width:900px){ .grid{grid-template-columns:1fr} }
</style>
</head>
<body>

<div id="mainTool" class="card">
  <h1>🔐 CRYPTICX Ultra Hardened (Dark)</h1>

  <div class="grid">
    <div class="col">
      <label class="muted">Input (টেক্সট / Base64 / Encrypted)</label>
      <textarea id="textInput" placeholder="এখানে টেক্সট লিখো"></textarea>

      <div class="row">
        <input id="keyInput" placeholder="AES secret key (অপশনাল)" />
        <select id="b64Option" title="Base64 mode" style="width:150px">
          <option value="utf8">UTF-8</option>
          <option value="base64">Already Base64</option>
        </select>
      </div>

      <div style="margin-top:12px; background: rgba(0,255,204,0.05); padding:12px; border-radius:8px; border:1px solid rgba(0,255,204,0.2);">
        <div class="controls" style="margin-bottom:8px">
          <button class="btn small" onclick="zlibEncode()">zlib64 Encode</button>
          <button class="btn small" onclick="zlibDecode()">zlib64 Decode</button>
          <button class="btn small" onclick="b64Encode()">Base64 Encode</button>
          <button class="btn small" onclick="b64Decode()">Base64 Decode</button>
          <button class="btn small" onclick="hashMD5()">MD5 Hash</button>
          <button class="btn small" onclick="sha256Fingerprint()">SHA-256 Fingerprint</button>
          <button class="btn small" onclick="compressThenAES()">Compress → AES Encrypt</button>
          <button class="btn small" onclick="AESThenDecompress()">AES Decrypt → Decompress</button>
          <button class="btn small" onclick="hashAndEncode()">MD5 → Base64</button>
        </div>

        <div style="display:flex;gap:8px">
          <button class="btn" onclick="copyOutput()">📋 Copy Output</button>
          <button class="btn" onclick="clearAll()">🧹 Clear</button>
        </div>
      </div>

      <div class="muted">নোট: MD5 irreversible; AES-এর জন্য একই key ব্যবহার করতে হবে; SHA-256 fingerprint দেখানো হচ্ছে।</div>
    </div>

    <div class="col side-section">
      <div class="name-tag">CRYPTICX</div>
      <div style="margin-top:10px">
        <label class="muted">Output</label>
        <pre id="outputText" aria-live="polite"></pre>
      </div>
      <div style="margin-top:8px">
        <input id="md5Check" placeholder="MD5 to verify (paste here)" />
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="btn small" onclick="verifyMD5()">Verify MD5</button>
          <button class="btn small" onclick="verifyMD5Prompt()">Prompt Verify</button>
        </div>
      </div>
      <div style="margin-top:12px">
        <label class="muted">Social Links</label>
        <div class="link-list" id="linksArea"></div>
      </div>
    </div>
  </div>
</div>

<script>
// Password protect
const TOOL_PASSWORD="CRYPTICX123";
function askPassword(){Swal.fire({title:'Enter Tool Password',input:'password',inputAttributes:{autocapitalize:'off'},showCancelButton:false,allowOutsideClick:false}).then(res=>{if(res.value===TOOL_PASSWORD){document.getElementById('mainTool').style.display='block';renderLinks();Swal.fire('✅ Access Granted','Welcome to CRYPTICX','success');}else{Swal.fire('❌ Wrong Password','Try again','error').then(()=>askPassword());}});}
window.onload=askPassword;

// converters
function uint8ToWordArray(u8){var words=[],i=0,len=u8.length;while(i<len){words.push(((u8[i++]||0)<<24)|((u8[i++]||0)<<16)|((u8[i++]||0)<<8)|(u8[i++]||0));}return CryptoJS.lib.WordArray.create(words,len);}
function wordArrayToUint8(wordArray){var len=wordArray.sigBytes, words=wordArray.words, u8=new Uint8Array(len), idx=0;for(var i=0;i<words.length;i++){var w=words[i];if(idx<len)u8[idx++]=(w>>24)&0xFF;if(idx<len)u8[idx++]=(w>>16)&0xFF;if(idx<len)u8[idx++]=(w>>8)&0xFF;if(idx<len)u8[idx++]=w&0xFF;}return u8;}
function uint8ToBase64(u8){let CHUNK=0x8000,i=0,len=u8.length,str='';while(i<len){let chunk=u8.subarray(i,Math.min(i+CHUNK,len));for(let j=0;j<chunk.length;j++)str+=String.fromCharCode(chunk[j]);i+=CHUNK;}return btoa(str);}
function base64ToUint8(b64){let bin=atob(b64);let u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);return u8;}
function setOutput(txt){document.getElementById('outputText').textContent=txt;}
function showErr(title,text,type='error'){Swal.fire(title,text,type);}

// Crypto functions same as previous (zlib64, Base64, MD5, SHA256, AES)...

// Social Links obfuscation
let _links=[
  {type:'facebook',url:'aHR0cHM6Ly9mYWNlYm9vay5jb20vbW9oYW1tYWQuYXJtYW44'},
  {type:'telegram',url:'aHR0cHM6Ly90Lm1lL0pVTklPUl9JTlZFU1RJR0FUT1I='}
];
function renderLinks(){let area=document.getElementById('linksArea');area.innerHTML='';_links.forEach(l=>{let btn=document.createElement('button');btn.style.cssText="font-size:22px;padding:10px;border-radius:50%;border:none;background:transparent;color:#00ffcc;cursor:pointer;transition:0.3s;";btn.innerHTML=l.type==='facebook'?'📘':'✈️';btn.onclick=()=>window.open(atob(l.url),'_blank');btn.onmouseover=()=>btn.style.transform='scale(1.2)';btn.onmouseout=()=>btn.style.transform='scale(1)';area.appendChild(btn);});}

// Copy / Clear
function copyOutput(){var txt=document.getElementById('outputText').textContent;if(!txt){showErr('❌ Empty','কপি করার জন্য আউটপুট নেই');return;}navigator.clipboard.writeText(txt).then(()=>Swal.fire('📋 Copied','Output clipboard-এ কপি হয়েছে','success'));}
function clearAll(){document.getElementById('textInput').value='';document.getElementById('outputText').textContent='';document.getElementById('keyInput').value='';document.getElementById('md5Check').value='';}
</script>

</body>
</html>
