<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CRYPTICX — Ultimate Tool (zlib64 · B64 · MD5 · SHA256 · AES)</title>

<!-- Libraries -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@10"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
  :root{--accent:#00ffcc;--bg:#0d1117;--panel:rgba(22,27,34,0.92)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Poppins',sans-serif;background:var(--bg);color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:18px}
  .card{width:100%;max-width:900px;background:var(--panel);border-radius:12px;padding:20px;border:2px solid rgba(0,255,204,0.12);box-shadow:0 14px 40px rgba(0,0,0,0.6)}
  h1{color:var(--accent);font-size:20px;margin-bottom:10px}
  .grid{display:grid;grid-template-columns:1fr 360px;gap:14px}
  .full{grid-column:1/-1}
  textarea,input,select{width:100%;padding:10px;border-radius:8px;border:2px solid var(--accent);background:rgba(12,15,20,0.6);color:var(--accent);outline:none;font-size:14px}
  textarea{min-height:130px;resize:vertical}
  .btn{display:inline-block;padding:10px;border-radius:8px;border:none;background:linear-gradient(45deg,var(--accent),#009999);color:#111;font-weight:700;cursor:pointer;margin-top:8px}
  .small{padding:8px;font-size:13px}
  .col{display:flex;flex-direction:column;gap:8px}
  .name-tag{font-weight:700;color:var(--accent);text-shadow:0 0 6px rgba(0,255,204,0.12);text-align:center;padding:8px;border-radius:6px;background:rgba(0,255,204,0.03)}
  pre{background:rgba(0,0,0,0.5);padding:12px;border-radius:8px;overflow:auto;color:#fff;white-space:pre-wrap;word-break:break-word}
  .controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .row{display:flex;gap:8px}
  .side-section{background:rgba(0,0,0,0.12);padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,0.02)}
  .link-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .link-item{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px;border-radius:6px;background:rgba(255,255,255,0.02)}
  .link-item button{padding:6px 8px;border-radius:6px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
  .muted{color:#bfc7c9;font-size:13px;margin-top:6px}
  @media (max-width:900px){ .grid{grid-template-columns:1fr} }
</style>
</head>
<body>

<div class="card" role="main">
  <h1>🔐 CRYPTICX — Ultimate Tool</h1>

  <div class="grid">
    <!-- LEFT: main tools -->
    <div class="col">
      <label class="muted">Input (টেক্সট / Base64 / Encrypted)</label>
      <textarea id="textInput" placeholder="এখানে টেক্সট লিখো — encode/decode/hash/encrypt-এর জন্য"></textarea>

      <div class="row">
        <input id="keyInput" placeholder="AES secret key (অপশনাল)" />
        <select id="b64Option" title="Base64 mode" style="width:150px">
          <option value="utf8">UTF-8</option>
          <option value="base64">Already Base64</option>
        </select>
      </div>

      <!-- Controls -->
      <div class="controls" style="margin-top:8px">
        <button class="btn small" onclick="zlibEncode()">zlib64 Encode</button>
        <button class="btn small" onclick="zlibDecode()">zlib64 Decode</button>
        <button class="btn small" onclick="b64Encode()">Base64 Encode</button>

        <button class="btn small" onclick="b64Decode()">Base64 Decode</button>
        <button class="btn small" onclick="hashMD5()">MD5 Hash</button>
        <button class="btn small" onclick="sha256Fingerprint()">SSL(SHA-256) Fingerprint</button>

        <button class="btn small" onclick="compressThenAES()">Compress → AES Encrypt</button>
        <button class="btn small" onclick="AESThenDecompress()">AES Decrypt → Decompress</button>
        <button class="btn small" onclick="hashAndEncode()">MD5 → Base64</button>
      </div>

      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn" onclick="copyOutput()">📋 Copy Output</button>
        <button class="btn" onclick="clearAll()">🧹 Clear</button>
      </div>

      <div class="muted">নোট: MD5 irreversible; AES-এর জন্য একই key ব্যবহার করতে হবে; SSL fingerprint হিসেবে SHA-256 দেখানো হচ্ছে।</div>
    </div>

    <!-- RIGHT: name tag, output, links -->
    <div class="col side-section">
      <div class="name-tag">CRYPTICX</div>

      <div style="margin-top:10px">
        <label class="muted">Output</label>
        <pre id="outputText" aria-live="polite"></pre>
      </div>

      <!-- MD5 verify -->
      <div style="margin-top:8px">
        <input id="md5Check" placeholder="MD5 to verify (paste here)" />
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="btn small" onclick="verifyMD5()">Verify MD5</button>
          <button class="btn small" onclick="verifyMD5Prompt()">Prompt Verify</button>
        </div>
      </div>

      <!-- Social links: Facebook + Telegram -->
      <div style="margin-top:12px">
        <label class="muted">Your Facebook / Telegram</label>
        <input id="socialInput" placeholder="Paste Facebook or Telegram profile URL" />
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="btn small" onclick="addSocial()">Add</button>
          <button class="btn small" onclick="clearSocialInput()">Clear</button>
        </div>

        <div class="link-list" id="linksArea"></div>
      </div>
    </div>
  </div>
</div>

<script>
/* ------------------------------
   Helper converters
   ------------------------------ */
function uint8ToWordArray(u8) {
  var words = [], i=0, len=u8.length;
  while(i<len){ words.push(((u8[i++]||0)<<24)|((u8[i++]||0)<<16)|((u8[i++]||0)<<8)|(u8[i++]||0)); }
  return CryptoJS.lib.WordArray.create(words, len);
}

function wordArrayToUint8(wordArray){
  var len=wordArray.sigBytes, words=wordArray.words, u8=new Uint8Array(len), idx=0;
  for(var i=0;i<words.length;i++){
    var w=words[i];
    if(idx<len)u8[idx++]=(w>>24)&0xFF;
    if(idx<len)u8[idx++]=(w>>16)&0xFF;
    if(idx<len)u8[idx++]=(w>>8)&0xFF;
    if(idx<len)u8[idx++]=w&0xFF;
  } return u8;
}

function uint8ToBase64(u8){
  var CHUNK=0x8000,i=0,len=u8.length,str='';
  while(i<len){var chunk=u8.subarray(i,Math.min(i+CHUNK,len));str+=String.fromCharCode.apply(null,chunk);i+=CHUNK;}
  return btoa(str);
}

function base64ToUint8(b64){var bin=atob(b64),len=bin.length,u8=new Uint8Array(len);for(var i=0;i<len;i++)u8[i]=bin.charCodeAt(i);return u8;}
function setOutput(txt){ document.getElementById('outputText').textContent = txt; }
function showErr(title,text,type='error'){ Swal.fire(title,text,type); }

/* ------------------------------
   zlib64 Encode / Decode
   ------------------------------ */
function zlibEncode(){try{var input=document.getElementById('textInput').value;if(!input){showErr('❌ Empty','Please enter text to encode.');return;}var compressed=pako.deflate(input);var b64=uint8ToBase64(compressed);setOutput(b64);Swal.fire('✅ Done','zlib64 encode হয়েছে','success');}catch(e){console.error(e);showErr('❌ Failed','zlib encode error');}}
function zlibDecode(){try{var input=document.getElementById('textInput').value.trim();if(!input){showErr('❌ Empty','Please paste Base64 zlib data to decode.');return;}var u8=base64ToUint8(input);var out=pako.inflate(u8,{to:'string'});setOutput(out);Swal.fire('✅ Done','zlib64 decode সফল হয়েছে','success');}catch(e){console.error(e);showErr('❌ Failed','Invalid zlib64 data or decompress error');}}

/* ------------------------------
   Base64 Encode / Decode
   ------------------------------ */
function b64Encode(){try{var input=document.getElementById('textInput').value;if(!input){showErr('❌ Empty','Enter text to Base64-encode.');return;}var b=btoa(unescape(encodeURIComponent(input)));setOutput(b);Swal.fire('✅ Done','Base64 encode সম্পন্ন','success');}catch(e){console.error(e);showErr('❌ Failed','Base64 encode error');}}
function b64Decode(){try{var input=document.getElementById('textInput').value.trim();if(!input){showErr('❌ Empty','Paste Base64 text to decode.');return;}var s=decodeURIComponent(escape(atob(input)));setOutput(s);Swal.fire('✅ Done','Base64 decode সম্পন্ন','success');}catch(e){console.error(e);showErr('❌ Failed','Invalid Base64 string');}}

/* ------------------------------
   MD5 / Verify / MD5->Base64
   ------------------------------ */
function hashMD5(){var input=document.getElementById('textInput').value;if(!input){showErr('❌ Empty','Enter text to hash.');return;}var h=CryptoJS.MD5(input).toString(CryptoJS.enc.Hex);setOutput(h);Swal.fire('✅ Done','MD5 generated','success');}
function verifyMD5(){var input=document.getElementById('textInput').value;var md5t=document.getElementById('md5Check').value.trim().toLowerCase();if(!input||!md5t){showErr('❌ Empty','Enter both text and MD5 to verify.');return;}var h=CryptoJS.MD5(input).toString(CryptoJS.enc.Hex);if(h===md5t)Swal.fire('✅ Match','MD5 মিলেছে','success');else Swal.fire('❌ No match','MD5 মিললো না','error');}
function verifyMD5Prompt(){Swal.fire({title:'Paste MD5 to verify',input:'text',showCancelButton:true}).then(res=>{if(!res.isConfirmed)return;document.getElementById('md5Check').value=(res.value||'').trim();verifyMD5();});}
function hashAndEncode(){var input=document.getElementById('textInput').value;if(!input){showErr('❌ Empty','Enter text to process.');return;}var md5=CryptoJS.MD5(input).toString(CryptoJS.enc.Hex);var b64=btoa(md5);setOutput(b64);Swal.fire('✅ Done','MD5 created and Base64-encoded','success');}

/* ------------------------------
   SSL (SHA-256) Fingerprint
   ------------------------------ */
function sha256Fingerprint(){var input=document.getElementById('textInput').value;if(!input){showErr('❌ Empty','Enter text to fingerprint.');return;}var hash=CryptoJS.SHA256(input).toString(CryptoJS.enc.Hex);var parts=hash.match(/.{1,2}/g).join(':').toUpperCase();setOutput(parts);Swal.fire('✅ Done','SHA-256 fingerprint generated','success');}

/* ------------------------------
   Compress -> AES encrypt
   ------------------------------ */
function compressThenAES(){try{var text=document.getElementById('textInput').value;var key=document.getElementById('keyInput').value;if(!text||!key){showErr('❌ Empty','Enter text and AES key.');return;}var compressed=pako.deflate(text);var wa=uint8ToWordArray(compressed);var cipher=CryptoJS.AES.encrypt(wa,key).toString();setOutput(cipher);Swal.fire('🔒 Encrypted','Compress + AES encryption সম্পন্ন','success');}catch(e){console.error(e);showErr('❌ Failed','Encrypt/compress error');}}
function AESThenDecompress(){try{var cipher=document.getElementById('textInput').value.trim()||document.getElementById('outputText').textContent.trim();var key=document.getElementById('keyInput').value;if(!cipher||!key){showErr('❌ Empty','Provide ciphertext and AES key.');return;}var decryptedWA=CryptoJS.AES.decrypt(cipher,key);var u8=wordArrayToUint8(decryptedWA);var plain=pako.inflate(u8,{to:'string'});setOutput(plain);Swal.fire('🔓 Decrypted','AES decrypt + decompress সফল','success');}catch(e){console.error(e);showErr('❌ Failed','Decrypt/decompress error — check key or ciphertext');}}

/* ------------------------------
   Social links (Facebook / Telegram)
   ------------------------------ */
var socialLinks = [
  {type:'facebook', url:'https://facebook.com/mohammad.arman8', label:'Facebook'},
  {type:'telegram', url:'https://t.me/JUNIOR_INVESTIGATOR', label:'Telegram'}
];

function addSocial(){var val=document.getElementById('socialInput').value.trim();if(!val){showErr('❌ Empty','Paste a Facebook or Telegram profile URL first');return;}var url=val;if(!/^https?:\/\//i.test(url))url='https://'+url;try{var u=new URL(url);}catch(e){showErr('❌ Invalid','URL ঠিক মতো নয়');return;}var type='other';if(u.hostname.includes('facebook.com'))type='facebook';else if(u.hostname.includes('t.me')||u.hostname.includes('telegram.me'))type='telegram';var label=(type==='facebook')?'Facebook':(type==='telegram'?'Telegram':'Link');socialLinks.push({type,url:u.href,label});renderLinks();document.getElementById('socialInput').value='';Swal.fire('✅ Added',label+' যোগ করা হয়েছে','success');}
function clearSocialInput(){document.getElementById('socialInput').value='';}
function renderLinks(){var area=document.getElementById('linksArea');area.innerHTML='';socialLinks.forEach((s,idx)=>{var div=document.createElement('div');div.className='link-item';var left=document.createElement('div');left.style.display='flex';left.style.gap='8px';left.style.alignItems='center';var icon=document.createElement('div');icon.textContent=(s.type==='facebook'?'📘':(s.type==='telegram'?'✈️':'🔗'));var text=document.createElement('div');text.textContent=s.label+' — '+s.url;left.appendChild(icon);left.appendChild(text);var right=document.createElement('div');var openBtn=document.createElement('button');openBtn.textContent='Open';openBtn.onclick=()=>window.open(s.url,'_blank');var copyBtn=document.createElement('button');copyBtn.textContent='Copy';copyBtn.onclick=()=>navigator.clipboard.writeText(s.url).then(()=>Swal.fire('Copied','URL কপি হয়েছে','success'));var delBtn=document.createElement('button');delBtn.textContent='Del';delBtn.onclick=()=>{socialLinks.splice(idx,1);renderLinks();};right.appendChild(openBtn);right.appendChild(copyBtn);right.appendChild(delBtn);div.appendChild(left);div.appendChild(right);area.appendChild(div);});}

// Initial render
renderLinks();

/* ------------------------------
   Copy / Clear utilities
   ------------------------------ */
function copyOutput(){var txt=document.getElementById('outputText').textContent;if(!txt){showErr('❌ Empty','কপি করার জন্য আউটপুট নেই');return;}navigator.clipboard.writeText(txt).then(()=>Swal.fire('📋 Copied','Output clipboard-এ কপি হয়েছে','success'));}
function clearAll(){document.getElementById('textInput').value='';document.getElementById('outputText').textContent='';document.getElementById('keyInput').value='';document.getElementById('md5Check').value='';}
</script>

</body>
</html>
